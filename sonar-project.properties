# ==============================================================================
# SonarCloud Configuration
# Product Feedback Sentiment API (FastAPI + React)
# ==============================================================================

sonar.projectKey=SmitSutariya0205_feedback-sentiment-app
sonar.organization=smitsutariya0205
sonar.projectName=Feedback Sentiment App

# Source code directories to analyze
sonar.sources=backend_backup,frontend/src
sonar.tests=backend_backup/tests,frontend/src/__tests__

# File encoding
sonar.sourceEncoding=UTF-8

# Files and directories to exclude from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/*.db,**/*.csv,**/*.sqlite*,**/coverage/**,**/test-results.xml

# Python test results and coverage reports
sonar.python.coverage.reportPaths=backend_backup/coverage.xml
sonar.python.xunit.reportPath=backend_backup/test-results.xml

# JavaScript / React coverage reports
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
