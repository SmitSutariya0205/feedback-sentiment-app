# ==============================================================================
# Azure DevOps Multi-Stage Pipeline
# Product Feedback Sentiment API — FastAPI + React
# Triggers on push to main branch
#
# REQUIRED SECRET VARIABLES (set in Azure DevOps UI → Pipelines → Edit → Variables):
#   apiBearerToken  — API Bearer token (mark as secret)
#   sqlLogin        — SQL admin username (mark as secret)
#   sqlPassword     — SQL admin password (mark as secret)
# ==============================================================================

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  nodeVersion: '20'
  azureSubscription: 'AzureStudentConnection'
  resourceGroupName: 'feedback-prod-rg'
  location: 'centralindia'
  webAppName: 'feedback-backend-smit0205'
  frontendWebAppName: 'feedback-frontend-smit0205'
  backendImageRepo: 'feedback-api-backend'
  frontendImageRepo: 'feedback-api-frontend'
  tag: '$(Build.BuildId)'

# ==============================================================================
# STAGE 1: BUILD & QUALITY GATES (CI)
# ==============================================================================
stages:
- stage: Build
  displayName: 'Build & Test'
  jobs:

  # ── Job 1: Backend Python Tests ────────────────────────────────────────────
  - job: BackendTest
    displayName: 'Backend - Python Tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Set Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        cd backend_backup
        pip install --upgrade pip uv
        uv pip install --system -r pyproject.toml
        pip install httpx pytest
      displayName: 'Install Python dependencies'

    - script: |
        cd backend_backup
        python -m pytest tests/test_api.py -v --tb=short --junitxml=test-results.xml
      displayName: 'Run Backend Tests (59 tests)'

    - task: PublishTestResults@2
      displayName: 'Publish Backend Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend_backup/test-results.xml'
        testRunTitle: 'Backend Python Tests'
      condition: always()

  # ── Job 2: Frontend React Tests & Build ────────────────────────────────────
  - job: FrontendTest
    displayName: 'Frontend - React Tests & Build'
    steps:
    - task: NodeTool@0
      displayName: 'Set Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd frontend
        npm ci
      displayName: 'npm ci (clean install)'

    - script: |
        cd frontend
        npm run test
      displayName: 'Run Frontend Tests (Vitest)'

    - script: |
        cd frontend
        npm run build
      displayName: 'Build React Production Bundle'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend Dist'
      inputs:
        targetPath: 'frontend/dist'
        artifactName: 'frontend-dist'

  # ── Job 3: Security & Dependency Audit ─────────────────────────────────────
  - job: SecurityScan
    displayName: 'Security & Dependency Audit'
    steps:
    - script: |
        cd frontend
        npm audit --audit-level=high || true
      displayName: 'npm audit (Frontend)'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install pip-audit uv
        cd backend_backup
        uv pip install --system -r pyproject.toml
        pip-audit || true
      displayName: 'pip-audit (Backend)'

  # ── Job 4: Publish ARM Templates ───────────────────────────────────────────
  - job: PublishInfraArtifacts
    displayName: 'Publish ARM Templates'
    steps:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM Templates'
      inputs:
        targetPath: 'infrastructure/arm'
        artifactName: 'arm-templates'

# ==============================================================================
# STAGE 2: DEPLOYMENT (CD)
# ==============================================================================
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployInfra
    displayName: 'Deploy Infrastructure & Apps'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # 0. Checkout Git repository code
          - checkout: self

          # 1. Download ARM template artifacts
          - download: current
            artifact: arm-templates

          # 2. Create Resource Group (if not exists)
          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create --name $(resourceGroupName) --location $(location)

          # 3. Deploy ARM Template (ACR + Key Vault + Backend App + Frontend App + SQL Database)
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy ARM Template'
            inputs:
              azureResourceManagerConnection: '$(azureSubscription)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              csmFile: '$(Pipeline.Workspace)/arm-templates/main.json'
              overrideParameters: '-webAppName $(webAppName) -frontendWebAppName $(frontendWebAppName) -sku B1 -location $(location) -apiBearerToken $(apiBearerToken) -sqlLogin $(sqlLogin) -sqlPassword $(sqlPassword)'
              deploymentMode: 'Incremental'

          # 4. Build & Push BOTH Docker images (Backend & Frontend) to ACR
          - task: AzureCLI@2
            displayName: 'Docker Build & Push (Backend & Frontend)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get ACR login server
                ACR_NAME=$(az acr list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)
                echo "Target ACR Registry: $ACR_LOGIN_SERVER"

                az acr login --name $ACR_NAME

                # 🐳 1. Build & Push Backend Container Image
                echo "Building Backend Container..."
                docker build \
                  -t $ACR_LOGIN_SERVER/$(backendImageRepo):$(tag) \
                  -t $ACR_LOGIN_SERVER/$(backendImageRepo):latest \
                  -f backend_backup/Dockerfile \
                  backend_backup/

                docker push $ACR_LOGIN_SERVER/$(backendImageRepo):$(tag)
                docker push $ACR_LOGIN_SERVER/$(backendImageRepo):latest

                # 🐳 2. Build & Push Frontend Nginx+React Container Image
                echo "Building Frontend Container..."
                docker build \
                  -t $ACR_LOGIN_SERVER/$(frontendImageRepo):$(tag) \
                  -t $ACR_LOGIN_SERVER/$(frontendImageRepo):latest \
                  -f frontend/Dockerfile \
                  frontend/

                docker push $ACR_LOGIN_SERVER/$(frontendImageRepo):$(tag)
                docker push $ACR_LOGIN_SERVER/$(frontendImageRepo):latest

          # 5. Update Web App containers & restart
          - task: AzureCLI@2
            displayName: 'Update Web App Containers'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)

                # Update Backend Web App
                echo "Updating Backend Web App container..."
                az webapp config container set \
                  --name $(webAppName) \
                  --resource-group $(resourceGroupName) \
                  --container-image-name "$ACR_LOGIN_SERVER/$(backendImageRepo):$(tag)" \
                  --container-registry-url "https://$ACR_LOGIN_SERVER"

                az webapp restart --name $(webAppName) --resource-group $(resourceGroupName)

                # Update Frontend Web App
                echo "Updating Frontend Web App container..."
                az webapp config container set \
                  --name $(frontendWebAppName) \
                  --resource-group $(resourceGroupName) \
                  --container-image-name "$ACR_LOGIN_SERVER/$(frontendImageRepo):$(tag)" \
                  --container-registry-url "https://$ACR_LOGIN_SERVER"

                az webapp restart --name $(frontendWebAppName) --resource-group $(resourceGroupName)

          # 6. Health check validation
          - script: |
              echo "Waiting 45 seconds for containers to start..."
              sleep 45
              BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/health || echo "000")
              FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$(frontendWebAppName).azurewebsites.net/ || echo "000")
              echo "Backend health check: $BACKEND_STATUS"
              echo "Frontend health check: $FRONTEND_STATUS"
              if [ "$BACKEND_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
                echo "✅ Full Stack Deployment verified — both Backend and Frontend are healthy!"
              else
                echo "⚠️ Check completed: Backend $BACKEND_STATUS, Frontend $FRONTEND_STATUS"
              fi
            displayName: 'Post-Deployment Health Check'
