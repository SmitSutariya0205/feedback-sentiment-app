# ==============================================================================
# Azure DevOps Multi-Stage Pipeline
# Product Feedback Sentiment API — FastAPI + React (Azure Static Web App)
# Triggers on push to main branch
#
# REQUIRED SECRET VARIABLES (set in Azure DevOps UI → Pipelines → Edit → Variables):
#   apiBearerToken  — API Bearer token (mark as secret)
#   sqlLogin        — SQL admin username (mark as secret)
#   sqlPassword     — SQL admin password (mark as secret)
# ==============================================================================

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  nodeVersion: '20'
  azureSubscription: 'AzureStudentConnection'
  resourceGroupName: 'feedback-prod-rg'
  location: 'centralindia'
  webAppName: 'feedback-backend-smit0205'
  staticWebAppName: 'feedback-frontend-smit0205'
  backendImageRepo: 'feedback-api-backend'
  dockerfilePath: 'backend_backup/Dockerfile'
  tag: '$(Build.BuildId)'

# ==============================================================================
# STAGE 1: BUILD & QUALITY GATES (CI)
# ==============================================================================
stages:
- stage: Build
  displayName: 'Build & Test'
  jobs:

  # ── Job 1: Backend Python Tests ────────────────────────────────────────────
  - job: BackendTest
    displayName: 'Backend - Python Tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Set Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        cd backend_backup
        pip install --upgrade pip uv
        uv pip install --system -r pyproject.toml
        pip install httpx pytest
      displayName: 'Install Python dependencies'

    - script: |
        cd backend_backup
        python -m pytest tests/test_api.py -v --tb=short --junitxml=test-results.xml
      displayName: 'Run Backend Tests (59 tests)'

    - task: PublishTestResults@2
      displayName: 'Publish Backend Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend_backup/test-results.xml'
        testRunTitle: 'Backend Python Tests'
      condition: always()

  # ── Job 2: Frontend React Tests & Static Build ─────────────────────────────
  - job: FrontendTest
    displayName: 'Frontend - React Tests & Build'
    steps:
    - task: NodeTool@0
      displayName: 'Set Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd frontend
        npm ci
      displayName: 'npm ci (clean install)'

    - script: |
        cd frontend
        npm run test
      displayName: 'Run Frontend Tests (Vitest)'

    - script: |
        cd frontend
        npm run build
      displayName: 'Build Production React Static Bundle (dist)'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend Static Dist'
      inputs:
        targetPath: 'frontend/dist'
        artifactName: 'frontend-dist'

  # ── Job 3: Security & Dependency Audit ─────────────────────────────────────
  - job: SecurityScan
    displayName: 'Security & Dependency Audit'
    steps:
    - script: |
        cd frontend
        npm audit --audit-level=high || true
      displayName: 'npm audit (Frontend)'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install pip-audit uv
        cd backend_backup
        uv pip install --system -r pyproject.toml
        pip-audit || true
      displayName: 'pip-audit (Backend)'

  # ── Job 4: Publish ARM Templates ───────────────────────────────────────────
  - job: PublishInfraArtifacts
    displayName: 'Publish ARM Templates'
    steps:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM Templates'
      inputs:
        targetPath: 'infrastructure/arm'
        artifactName: 'arm-templates'

# ==============================================================================
# STAGE 2: DEPLOYMENT (CD)
# ==============================================================================
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployInfra
    displayName: 'Deploy Infrastructure & Applications'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # 0. Checkout Git repository code
          - checkout: self

          # 1. Download Artifacts (ARM templates + Frontend dist)
          - download: current
            artifact: arm-templates

          - download: current
            artifact: frontend-dist

          # 2. Create Resource Group (if not exists)
          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create --name $(resourceGroupName) --location $(location)

          # 3. Deploy ARM Template (ACR + Key Vault + Backend Container App + Azure Static Web App + Azure SQL)
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy ARM Template'
            inputs:
              azureResourceManagerConnection: '$(azureSubscription)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              csmFile: '$(Pipeline.Workspace)/arm-templates/main.json'
              overrideParameters: '-webAppName $(webAppName) -staticWebAppName $(staticWebAppName) -sku B1 -location $(location) -apiBearerToken $(apiBearerToken) -sqlLogin $(sqlLogin) -sqlPassword $(sqlPassword)'
              deploymentMode: 'Incremental'

          # 4. Build & Push Backend Docker Image to ACR
          - task: AzureCLI@2
            displayName: 'Docker Build & Push Backend Container to ACR'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                ACR_NAME=$(az acr list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)
                echo "Target ACR Registry: $ACR_LOGIN_SERVER"

                az acr login --name $ACR_NAME

                # Build & push Backend Docker image
                docker build \
                  -t $ACR_LOGIN_SERVER/$(backendImageRepo):$(tag) \
                  -t $ACR_LOGIN_SERVER/$(backendImageRepo):latest \
                  -f $(dockerfilePath) \
                  backend_backup/

                docker push $ACR_LOGIN_SERVER/$(backendImageRepo):$(tag)
                docker push $ACR_LOGIN_SERVER/$(backendImageRepo):latest

          # 5. Update Backend Web App container image & restart
          - task: AzureCLI@2
            displayName: 'Update Backend Web App Container Image'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)

                az webapp config container set \
                  --name $(webAppName) \
                  --resource-group $(resourceGroupName) \
                  --container-image-name "$ACR_LOGIN_SERVER/$(backendImageRepo):$(tag)" \
                  --container-registry-url "https://$ACR_LOGIN_SERVER"

                az webapp restart --name $(webAppName) --resource-group $(resourceGroupName)

          # 6. Deploy React static dist to Azure Static Web App
          - task: AzureCLI@2
            displayName: 'Deploy React Static App to Azure Static Web App'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Deploying static dist bundle to Azure Static Web App..."
                # Get deployment token for Static Web App
                SWA_TOKEN=$(az staticwebapp secrets list --name $(staticWebAppName) --resource-group $(resourceGroupName) --query "properties.apiKey" -o tsv)

                # Install SWA CLI and deploy dist folder directly
                npm install -g @azure/static-web-apps-cli
                swa deploy $(Pipeline.Workspace)/frontend-dist --deployment-token $SWA_TOKEN --env production

          # 7. Post-deployment Health Checks
          - script: |
              echo "Waiting 30 seconds for services..."
              sleep 30
              BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/health || echo "000")
              echo "Backend health check: $BACKEND_STATUS"
              if [ "$BACKEND_STATUS" = "200" ]; then
                echo "✅ Full Stack Deployment verified — Backend is healthy and Azure Static Web App is deployed!"
              else
                echo "⚠️ Backend health status: $BACKEND_STATUS"
              fi
            displayName: 'Post-Deployment Health Check'
