# ==============================================================================
# Azure DevOps Multi-Stage Pipeline
# Product Feedback Sentiment API — FastAPI + React
# Triggers on push to main branch
#
# REQUIRED SECRET VARIABLES (set in Azure DevOps UI → Pipelines → Edit → Variables):
#   apiBearerToken  — API Bearer token (mark as secret)
#   sqlLogin        — SQL admin username (mark as secret)
#   sqlPassword     — SQL admin password (mark as secret)
# ==============================================================================

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  nodeVersion: '20'
  azureSubscription: 'AzureStudentConnection'
  resourceGroupName: 'feedback-prod-rg'
  location: 'centralindia'
  webAppName: 'feedback-app-smit0205'
  imageRepository: 'feedback-api-backend'
  dockerfilePath: 'backend_backup/Dockerfile'
  tag: '$(Build.BuildId)'
  # NOTE: apiBearerToken, sqlLogin, sqlPassword are set as SECRET
  # variables in the Azure DevOps pipeline UI — never in this YAML file.

# ==============================================================================
# STAGE 1: BUILD & QUALITY GATES (CI)
# ==============================================================================
stages:
- stage: Build
  displayName: 'Build & Test'
  jobs:

  # ── Job 1: Backend Python Tests ────────────────────────────────────────────
  - job: BackendTest
    displayName: 'Backend - Python Tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Set Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        cd backend_backup
        pip install --upgrade pip uv
        uv pip install --system -r pyproject.toml
        pip install httpx pytest
      displayName: 'Install Python dependencies'

    - script: |
        cd backend_backup
        python -m pytest tests/test_api.py -v --tb=short --junitxml=test-results.xml
      displayName: 'Run Backend Tests (59 tests)'

    - task: PublishTestResults@2
      displayName: 'Publish Backend Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend_backup/test-results.xml'
        testRunTitle: 'Backend Python Tests'
      condition: always()

  # ── Job 2: Frontend React Tests & Build ────────────────────────────────────
  - job: FrontendTest
    displayName: 'Frontend - React Tests & Build'
    steps:
    - task: NodeTool@0
      displayName: 'Set Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        cd frontend
        npm ci
      displayName: 'npm ci (clean install)'

    - script: |
        cd frontend
        npm run test
      displayName: 'Run Frontend Tests (Vitest)'

    - script: |
        cd frontend
        npm run build
      displayName: 'Build React Production Bundle'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend Dist'
      inputs:
        targetPath: 'frontend/dist'
        artifactName: 'frontend-dist'

  # ── Job 3: Security & Dependency Audit ─────────────────────────────────────
  - job: SecurityScan
    displayName: 'Security & Dependency Audit'
    steps:
    - script: |
        cd frontend
        npm audit --audit-level=high || true
      displayName: 'npm audit (Frontend)'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install pip-audit uv
        cd backend_backup
        uv pip install --system -r pyproject.toml
        pip-audit || true
      displayName: 'pip-audit (Backend)'

  # ── Job 4: Docker Build & Push to ACR ──────────────────────────────────────
  - job: DockerBuildPush
    displayName: 'Docker Build & Push to ACR'
    dependsOn:
    - BackendTest
    - FrontendTest
    condition: succeeded()
    steps:

    # Login to ACR using Azure CLI
    - task: AzureCLI@2
      displayName: 'Get ACR Login Server'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Get ACR login server from the resource group
          ACR_NAME=$(az acr list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)
          echo "##vso[task.setvariable variable=acrName]$ACR_NAME"
          echo "##vso[task.setvariable variable=acrLoginServer]$ACR_LOGIN_SERVER"
          echo "ACR found: $ACR_LOGIN_SERVER"

    # Build and Push Docker image to ACR
    - task: AzureCLI@2
      displayName: 'Docker Build & Push'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr build \
            --registry $(acrName) \
            --image $(imageRepository):$(tag) \
            --image $(imageRepository):latest \
            --file $(dockerfilePath) \
            backend_backup/

  # ── Job 5: Publish ARM Templates ───────────────────────────────────────────
  - job: PublishInfraArtifacts
    displayName: 'Publish ARM Templates'
    steps:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM Templates'
      inputs:
        targetPath: 'infrastructure/arm'
        artifactName: 'arm-templates'

# ==============================================================================
# STAGE 2: DEPLOYMENT (CD)
# ==============================================================================
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployInfra
    displayName: 'Deploy Infrastructure & App'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # 1. Download ARM template artifacts
          - download: current
            artifact: arm-templates

          # 2. Create Resource Group (if not exists)
          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create --name $(resourceGroupName) --location $(location)

          # 3. Deploy ARM Template (ACR + App Service + SQL Database)
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy ARM Template'
            inputs:
              azureResourceManagerConnection: '$(azureSubscription)'
              resourceGroupName: '$(resourceGroupName)'
              location: '$(location)'
              csmFile: '$(Pipeline.Workspace)/arm-templates/main.json'
              overrideParameters: '-webAppName $(webAppName) -sku B1 -location $(location) -apiBearerToken $(apiBearerToken) -sqlLogin $(sqlLogin) -sqlPassword $(sqlPassword)'
              deploymentMode: 'Incremental'

          # 4. Update Web App to use the freshly built Docker image from ACR
          - task: AzureCLI@2
            displayName: 'Update Web App Container Image'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get ACR login server
                ACR_LOGIN_SERVER=$(az acr list --resource-group $(resourceGroupName) --query "[0].loginServer" -o tsv)
                echo "Updating Web App to image: $ACR_LOGIN_SERVER/$(imageRepository):$(tag)"

                # Update the Web App container settings
                az webapp config container set \
                  --name $(webAppName) \
                  --resource-group $(resourceGroupName) \
                  --container-image-name "$ACR_LOGIN_SERVER/$(imageRepository):$(tag)" \
                  --container-registry-url "https://$ACR_LOGIN_SERVER"

                # Restart the Web App to pull the new image
                az webapp restart --name $(webAppName) --resource-group $(resourceGroupName)

          # 5. Health check validation
          - script: |
              echo "Waiting 60 seconds for container to start..."
              sleep 60
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/health || echo "000")
              echo "Health check status: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Deployment verified — application is healthy!"
              else
                echo "⚠️ Health check returned $STATUS (container may still be starting)"
              fi
            displayName: 'Post-Deployment Health Check'
